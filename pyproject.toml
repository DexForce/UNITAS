[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitas-wam"
version = "0.1.0"
description = "UNITAS policy and action-conditioned scene flow inference"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<2", "scipy>=1.10", "requests>=2.31", "json-numpy>=2.1",
  "imageio[ffmpeg]>=2.34", "pyyaml>=6",
  "torch==2.5.1", "torchvision==0.20.1", "transformers==4.57.1",
  "timm>=1.0.19,<1.1", "einops>=0.8", "pillow>=10",
  "fastapi>=0.115", "uvicorn>=0.30", "trimesh>=4",
  "urchin>=0.0.27,<0.1", "pytorch-kinematics>=0.7", "pycollada>=0.8",
  "viser==1.0.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[project.scripts]
unitas-policy-server = "unitas.inference.server:main"
unitas-libero-client = "evaluation.libero.client:main"
unitas-robotwin-client = "evaluation.robotwin.client:main"
unitas-vlabench-client = "evaluation.vlabench.client:main"
unitas-libero-plus-client = "evaluation.libero_plus.client:main"
unitas-scene-flow = "unitas.scene_flow.inference:main"
unitas-view = "unitas.scene_flow.visualize:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-dir]
unitas = "src/unitas"
evaluation = "evaluation"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["unitas*", "evaluation*"]
namespaces = false

[tool.setuptools.package-data]
"evaluation.vlabench.configs" = ["*.json", "tracks/*.json"]
"evaluation.vlabench" = ["sdk/*.patch", "sdk/*.json", "sdk/LICENSE"]
"unitas.assets" = [
  "libero_panda/urdf/*.urdf",
  "libero_panda/meshes/visual/*.dae",
  "libero_panda/meshes/collision/*.stl",
  "robotwin_embodiments/aloha-agilex/*.json",
  "robotwin_embodiments/aloha-agilex/urdf/*.urdf",
  "vlabench_embodiments/franka_panda/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/unitas/models/encoders/modeling_florence2.py" = ["E402", "E711", "E721", "F401", "F841"]
"src/unitas/models/encoders/configuration_florence2.py" = ["E402", "E711", "E721", "F401", "F841"]
